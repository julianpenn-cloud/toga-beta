<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toga · tests</title>
<!--
  The Toga test suite. No build step, no dependencies, no server config: it loads the
  REAL index.html in a same-origin iframe and asserts against the deployed artifact, so
  the tests can never drift from the product.

  Run it locally:   python -m http.server 8766  →  http://127.0.0.1:8766/test.html
  Run it live:      https://julianpenn-cloud.github.io/toga/test.html
  Headless:         window.__toga reads { passed, failed, failures } once done.

  What it guards: the recurrence in colorForDate (order-independence catches cache-key
  bugs — the DST collision was found exactly this way), palette/verse/theme agreement,
  seasonal gates, WCAG contrast on the daily paper, and the outfit rules.
-->
<style>
  :root { --ink:#22301f; --paper:#f7f3ea; --card:#fffdf7; --line:#e6ddc9; --green:#2f4a36; --gold:#b3862f; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--paper); color: var(--ink);
         margin: 0; padding: 22px 18px 60px; font-size: 13px; line-height: 1.5; }
  h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 4px; }
  .sub { color: #7c826f; margin-bottom: 18px; }
  .banner { padding: 14px 16px; border-radius: 12px; font-weight: 700; font-size: 15px; margin-bottom: 18px; border: 1px solid var(--line); }
  .banner.pass { background: #e8f0e6; border-color: #b9cdb4; color: #24401f; }
  .banner.fail { background: #fbe9e7; border-color: #e6b3ac; color: #7a2a20; }
  .banner.run  { background: var(--card); }
  .suite { margin: 18px 0 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 10.5px; color: var(--gold); }
  .t { padding: 3px 0 3px 22px; position: relative; }
  .t::before { position: absolute; left: 0; font-weight: 700; }
  .t.ok::before { content: "✓"; color: #3f7a34; }
  .t.no::before { content: "✗"; color: #b3402f; }
  .t.no { color: #7a2a20; }
  .err { color: #7a2a20; background: #fbe9e7; border-radius: 6px; padding: 6px 8px; margin: 3px 0 6px; white-space: pre-wrap; }
  .detail { color: #7c826f; }
  iframe { position: absolute; width: 1180px; height: 900px; left: -4000px; top: 0; border: 0; }
</style>
</head>
<body>
<h1>Toga tests</h1>
<div class="sub" id="sub">loading the app…</div>
<div class="banner run" id="banner">running…</div>
<div id="out"></div>
<iframe id="app" src="index.html" title="the app under test"></iframe>

<script>
// ---------------------------------------------------------------- harness
const out = document.getElementById("out");
const res = [];
let t0 = 0;
let suite = "";
function group(name) { suite = name; const h = document.createElement("div"); h.className = "suite"; h.textContent = name; out.appendChild(h); }
function test(name, fn) {
  const row = document.createElement("div");
  try { fn(); row.className = "t ok"; row.textContent = name; res.push({ suite, name, ok: true }); }
  catch (e) { row.className = "t no"; row.textContent = name; res.push({ suite, name, ok: false, err: String(e && e.message || e) });
    out.appendChild(row); const box = document.createElement("div"); box.className = "err"; box.textContent = res[res.length-1].err; out.appendChild(box); return; }
  out.appendChild(row);
}
const ok  = (v, msg) => { if (!v) throw new Error(msg || "expected truthy, got " + JSON.stringify(v)); };
const eq  = (a, b, msg) => { if (a !== b) throw new Error((msg ? msg + " — " : "") + "expected " + JSON.stringify(b) + ", got " + JSON.stringify(a)); };
const near = (a, b, tol, msg) => { if (Math.abs(a-b) > tol) throw new Error((msg ? msg + " — " : "") + "expected ~" + b + " ±" + tol + ", got " + a); };

// ---------------------------------------------------------------- run
const frame = document.getElementById("app");
frame.addEventListener("load", run, { once: true });

function run() {
  const app = frame.contentWindow;
  const A = app.TOGA;                              // the app's published test surface
  const doc = frame.contentDocument;
  t0 = performance.now();

  // don't disturb whatever the reader had stored
  const saved = {};
  for (const k of ["toga.region", "toga.wx", "toga.seen"]) saved[k] = app.localStorage.getItem(k);

  const DAY = (y, m, d) => new Date(y, m, d);
  const SPAN = 730;
  const dayAt = i => DAY(2026, 0, 1 + i);
  const all = Array.from({ length: SPAN }, (_, i) => dayAt(i));
  const colors = all.map(d => A.colorForDate(d).shade.name);
  const monthsOf = {};
  colors.forEach((c, i) => (monthsOf[c] = monthsOf[c] || new Set()).add(all[i].getMonth()));

  try {

  // ---------------------------------------------------------------- engine
  group("engine · the pick");
  test("page under test loaded with no JS errors", () => {
    ok(A.colorForDate && A.PALETTE && A.outfitFor, "engine globals missing");
  });
  test("a date always yields the same color (determinism)", () => {
    for (let i = 0; i < SPAN; i += 7) eq(A.colorForDate(dayAt(i)).shade.name, colors[i]);
  });
  test("the answer doesn't depend on the time of day", () => {
    for (let i = 0; i < SPAN; i += 3) {
      const d = dayAt(i), at9 = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 21, 45);
      eq(A.colorForDate(at9).shade.name, colors[i], d.toDateString());
    }
  });
  test("the answer doesn't depend on the order days are asked for (cache integrity)", () => {
    // This is the test that catches cache-key collisions and un-normalised hashing:
    // asking in a different order must never change a single answer.
    const index = new Map(all.map((d, i) => [d.getTime(), i]));
    const ask = (d) => eq(A.colorForDate(d).shade.name, colors[index.get(d.getTime())], d.toDateString());
    for (let i = SPAN - 1; i >= 0; i--) ask(all[i]);                 // backwards
    for (let i = 0, x = 12345; i < SPAN; i++) {                      // scrambled
      x = (x * 1103515245 + 12345) & 0x7fffffff; ask(all[x % SPAN]);
    }
    for (let i = 0; i < SPAN; i += 2) ask(all[i]);                   // and mixed
  });
  test("no two adjacent days share a color (unless a holiday intervenes)", () => {
    for (let i = 1; i < SPAN; i++) {
      const prev = A.colorForDate(dayAt(i - 1)), cur = A.colorForDate(dayAt(i));
      if (prev.holiday || cur.holiday) continue;
      if (prev.shade.name === cur.shade.name) throw new Error(prev.shade.name + " twice: " + dayAt(i - 1).toDateString() + " → " + dayAt(i).toDateString());
    }
  });
  test("a holiday always wins its date", () => {
    for (const h of A.HOLIDAYS) {
      const probe = h.when ? DAY(2026, h.when[0] - 1, h.when[1]) : DAY(2026, h.range.from[0] - 1, h.range.from[1]);
      const r = A.colorForDate(probe);
      ok(r.holiday, h.name + " did not take " + probe.toDateString());
      ok(A.byLabel(r.shade.name), h.name + " resolved to an unknown color " + r.shade.name);
    }
  });
  test("during a theme week the pick comes only from that theme", () => {
    for (let i = 0; i < SPAN; i++) {
      const r = A.colorForDate(dayAt(i));
      if (r.holiday || !r.theme) continue;
      ok(r.theme.colors.includes(r.shade.name), r.theme.name + " produced " + r.shade.name);
    }
  });
  test("a color never appears in a month its curve forbids", () => {
    for (const c of A.PALETTE) {
      for (const m of monthsOf[c.label] || []) {
        const next = (m + 1) % 12;
        ok(c.curve[m] > 0 || c.curve[next] > 0, c.label + " appeared in month " + (m + 1) + " but its curve is 0 for that month and the next");
      }
    }
  });
  test("every palette color is reachable in a year (no dead colors)", () => {
    for (const c of A.PALETTE) {
      let n = 0; for (let i = 0; i < 365; i++) if (colors[i] === c.label) n++;
      ok(n >= 3, c.label + " only appeared " + n + " times in a year");
    }
  });
  test("weekends get a real color too (not a blank)", () => {
    for (let i = 0; i < SPAN; i++) {
      const d = dayAt(i); if (d.getDay() !== 0 && d.getDay() !== 6) continue;
      ok(A.byLabel(A.colorForDate(d).shade.name), "weekend " + d.toDateString() + " has no color");
    }
  });

  // ---------------------------------------------------------------- helpers
  group("engine · helpers");
  test("moodFromCode buckets every WMO code we can receive", () => {
    eq(A.moodFromCode(0), "sunny"); eq(A.moodFromCode(1), "sunny");
    eq(A.moodFromCode(2), "cloudy"); eq(A.moodFromCode(3), "cloudy");
    eq(A.moodFromCode(45), "cloudy"); eq(A.moodFromCode(48), "cloudy");
    eq(A.moodFromCode(51), "rain"); eq(A.moodFromCode(65), "rain"); eq(A.moodFromCode(82), "rain");
    eq(A.moodFromCode(71), "snow"); eq(A.moodFromCode(75), "snow"); eq(A.moodFromCode(86), "snow");
    eq(A.moodFromCode(99), "rain");
  });
  test("the moon runs 8 phases and cycles ~29.5 days", () => {
    const names = new Set(); for (let i = 0; i < 30; i++) names.add(A.getMoon(dayAt(i)).name);
    ok(names.size === 8, "saw " + names.size + " phase names");
    const a = A.getMoon(DAY(2026, 0, 1)), b = A.getMoon(DAY(2026, 0, 30));
    near(Math.abs(b.frac - a.frac), 0, 0.06, "a synodic month should return to the same phase");
  });
  test("all eight seasons appear across a year", () => {
    const s = new Set(); for (let i = 0; i < 365; i++) s.add(A.seasonFor(dayAt(i)).name);
    eq(s.size, 8, "seasons seen: " + [...s].join(", "));
  });
  test("daySeed is non-decreasing (a later day never hashes earlier)", () => {
    // Note: daySeed counts elapsed ms, so the spring DST switch can repeat one value.
    // Adjacent-day repeats are caught by the no-repeat test above; this guards ordering.
    for (let i = 1; i < SPAN; i++) ok(A.daySeed(dayAt(i)) >= A.daySeed(dayAt(i - 1)));
  });

  // ---------------------------------------------------------------- integrity
  group("content · the structures agree");
  test("every theme-week color label resolves to a real palette color", () => {
    for (const t of A.THEME_WEEKS) for (const l of t.colors)
      ok(A.byLabel(l), t.name + " references unknown color \"" + l + "\"");
  });
  test("every holiday has a color and it exists", () => {
    for (const h of A.HOLIDAYS) { ok(h.color, h.name + " has no color"); ok(A.byLabel(h.color.label), h.name); }
  });
  test("every palette color has a valid hex and a team", () => {
    for (const c of A.PALETTE) { ok(/^#[0-9a-f]{6}$/i.test(c.hex), c.label + " hex " + c.hex); ok(c.team, c.label + " has no team"); }
  });
  test("every palette color has verses for each season it can actually appear in", () => {
    const coarseOf = m => (m <= 1 || m === 11) ? "winter" : m <= 4 ? "spring" : m <= 7 ? "summer" : "autumn";
    for (const c of A.PALETTE) {
      const bank = A.VERSES[c.label];
      ok(bank, c.label + " has no verse bank at all");
      const seasons = new Set([...(monthsOf[c.label] || [])].map(coarseOf));
      ok(seasons.size > 0, c.label + " never appeared, so its verses are untested");
      for (const s of seasons) ok(bank[s] && bank[s].length, c.label + " appears in " + s + " but has no " + s + " verse");
    }
  });
  test("every verse is short and non-empty", () => {
    for (const [label, bank] of Object.entries(A.VERSES))
      for (const [season, lines] of Object.entries(bank))
        for (const l of lines) {
          ok(l && l.trim().length > 12, label + "/" + season + " has a blank verse");
          ok(l.length <= 120 && l.split("\n").length <= 3, label + "/" + season + " verse too long: " + JSON.stringify(l.slice(0, 60)));
        }
  });
  test("a rendered day always produces a verse and a team", () => {
    for (let i = 0; i < SPAN; i++) {
      const r = A.colorForDate(dayAt(i));
      ok(A.verseFor(dayAt(i), r).body.trim(), "empty verse on " + dayAt(i).toDateString());
      ok(r.team, "no team on " + dayAt(i).toDateString());
    }
  });
  test("no leftover team/location/person references", () => {
    const html = doc.documentElement.innerHTML;
    for (const w of ["Cedars", "Lakeside", "Jasmin", "Bigos"]) ok(!html.includes(w), "found \"" + w + "\" in the page");
    // The designer's own name is exempted in exactly one place: the colophon, which is
    // authorship rather than product content. The employer and property words above stay
    // banned everywhere, colophon included, so this stays a real guard.
    const clone = doc.documentElement.cloneNode(true);
    const col = clone.querySelector("footer .colophon");
    if (col) col.remove();
    ok(!clone.innerHTML.includes("Julian"), "found \"Julian\" outside the colophon");
  });

  // ---------------------------------------------------------------- brand
  group("brand · classic wordmark, independent of any CDN");
  test("the build number is shown beside the wordmark and in the footer", () => {
    // One number, one place in the source. It renders in both spots, and it is also the
    // service worker's cache name (checked after this run, since that needs a fetch), so a
    // person can read the page and know which build their browser actually cached.
    eq(A.VERSION, doc.getElementById("hdrVer").textContent, "the header does not show the build number");
    eq(A.VERSION, doc.getElementById("ftrVer").textContent, "the footer does not show the build number");
    ok(/^v\d+$/.test(A.VERSION), "the build number is not v<digits>: " + A.VERSION);
    for (const id of ["hdrVer", "ftrVer"]) {
      const box = doc.getElementById(id).getBoundingClientRect();
      ok(box.width > 0 && box.height > 0, id + " is in the page but not visible");
    }
  });
  test("the wordmark is set in the inlined face, and it loaded", () => {
    const wm = doc.querySelector(".wordmark");
    ok(wm, "no wordmark in the page");
    const fam = app.getComputedStyle(wm).fontFamily;
    ok(/Toga Mark/.test(fam), "wordmark is not using the inlined face: " + fam);
    ok(app.document.fonts.check('700 56px "Toga Mark"'), "the inlined face did not load");
  });
  test("the inlined wordmark font keeps its kerning", () => {
    // subsetting with an empty --layout-features strips the GPOS lookups, and "To" is the one
    // kerned pair in "Toga": without it the T sits ~4.6px too far from the o at header size
    const c = doc.createElement("canvas").getContext("2d");
    c.font = '700 100px "Toga Mark"';
    const kern = (c.measureText("To").width - c.measureText("T").width - c.measureText("o").width) / 100;
    ok(kern < -0.02, "the wordmark font lost its kerning (To = " + kern.toFixed(4) + "em) — the T will float");
  });
  test("the wordmark is title case — not caps, not small caps", () => {
    // caps of any kind read as initials, and TOGA is an anagram of GOAT
    const cs = app.getComputedStyle(doc.querySelector(".wordmark"));
    eq(cs.textTransform, "none", "a text-transform is making the name read as initials");
    eq(cs.fontVariantCaps, "normal", "small caps still reads as initials");
    // the region rides inside the wordmark ("Toga · Minneapolis–St. Paul, MN"), so strip it
    // before comparing — otherwise this test silently depends on whether a zip is stored,
    // which is exactly the state a real user is in and a clean browser is not
    const h1 = doc.querySelector(".wordmark");
    const reg = h1.querySelector(".brand-region");
    const name = h1.textContent.replace(reg ? reg.textContent : "", "").trim();
    eq(name, "Toga", 'the name should be exactly "Toga"');
  });
  test("the wordmark is narrower than it is naturally set", () => {
    // no classic serif is meaningfully narrower than another, so the proportions come from
    // condensing the letterforms. If this drops back to 1, the mark has lost its shape.
    const wm = doc.querySelector(".wordmark");
    const m = new DOMMatrixReadOnly(app.getComputedStyle(wm).transform);
    ok(m.a < 0.85 && m.a > 0.6, "wordmark condensation is " + m.a.toFixed(2) + ", expected ~0.72");
    ok(Math.abs(m.d - 1) < 0.01, "the wordmark is being squashed vertically too");
  });
  test("the wordmark font is embedded, not fetched", () => {
    const css = [...doc.querySelectorAll("style")].map(s => s.textContent).join("");
    ok(/@font-face[^}]*Toga Mark/.test(css), "no @font-face declared for the wordmark");
    ok(/url\(data:font\/woff2;base64,/.test(css), "the wordmark font is not inlined as base64");
  });
  test("the bookplate rule measures the name, not the whole type block", () => {
    const wm = doc.querySelector(".wordmark");
    const rule = app.getComputedStyle(wm, "::before");
    eq(rule.display, "block", "the rule should be a block");
    // compare layout widths: the rect is post-transform, the two scale together
    near(parseFloat(rule.width), wm.offsetWidth, 1.5, "rule width vs wordmark layout width");
  });
  test("the mark is a bathrobe: a rolled collar and a belt", () => {
    // the shawl collar is what makes it a bathrobe rather than a generic tunic, so hold onto it
    const svg = doc.getElementById("toga-mark").innerHTML;
    ok(/stroke-linecap="round"/.test(svg), "the rolled shawl collar is gone");
    const paths = svg.match(/<path/g) || [];
    ok(paths.length >= 4, "expected a body, collar, belt and knot; found " + paths.length + " path(s)");
    ok(!/<circle|<rect|<ellipse/.test(svg), "the mark has grown a disc or box again");
  });
  test("the mark appears in the header, footer and welcome card", () => {
    for (const sel of ["header .mark", "footer .mark-sm", ".welcome-card .mark-lg"])
      ok(doc.querySelector(sel), "missing the mark at " + sel);
  });
  test("the mark is a single colour drawn from the day", () => {
    // the whole point: one toga, wearing today's colour, so the brand is never a rainbow
    const svg = doc.getElementById("toga-mark").innerHTML;
    ok(/fill="var\(--day\)"/.test(svg), "the mark is not filled with the day's colour");
    ok(/stroke="var\(--day-deep\)"/.test(svg), "the mark is not keylined in the deep day colour");
    const colours = svg.match(/#[0-9a-fA-F]{6}/g) || [];
    eq(colours.length, 0, "the mark hard-codes colours instead of following the day: " + colours.join(", "));
    ok(!/url\(#/.test(svg) && !/<ellipse/.test(svg) && !/<g /.test(svg),
       "the mark has picked up gradients, shading or grouping again");
  });
  test("the mark's keyline is the same colour as the day, never the house green", () => {
    // --day-ink falls back to green for greys and whites, which would put a green keyline round
    // a white toga — two colours. For an achromatic day the keyline must be achromatic too.
    const chroma = h => { const v = A.hexRGB(h); return (Math.max(...v) - Math.min(...v)) / 255; };
    let worst = null;
    for (const c of A.PALETTE) {
      if (chroma(c.hex) >= 0.08) continue;                  // only the achromatic days are at risk
      A.paintPage(c.hex);
      const deep = app.getComputedStyle(doc.documentElement).getPropertyValue("--day-deep").trim();
      if (chroma(deep) >= 0.08) worst = c.label + " keylined " + deep;
    }
    A.renderAll();
    eq(worst, null, "an achromatic day picked up a colourful keyline: " + worst);
  });
  test("the mark's keyline stays visible on every day's paper", () => {
    // a white toga on cream is an outline drawing — but only if the keyline actually reads
    const lum = h => { const [r, g, b] = A.hexRGB(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
    let worst = 99, at = "";
    for (const c of A.PALETTE) {
      A.paintPage(c.hex);
      const cs = app.getComputedStyle(doc.documentElement);
      const r = ratio(cs.getPropertyValue("--day-deep").trim(), cs.getPropertyValue("--paper").trim());
      if (r < worst) { worst = r; at = c.label; }
    }
    A.renderAll();
    ok(worst >= 3, "the mark's outline only reaches " + worst.toFixed(2) + ":1 on a " + at + " day");
  });

  // ---------------------------------------------------------------- sky
  group("sky · checked against published almanac times");
  test("the four 2026 season crossings match the almanac", () => {
    // published UTC instants for 2026, from the standard equinox/solstice tables
    const published = [
      ["March equinox",     new Date(2026, 2, 10),  "2026-03-20T14:46:00Z"],
      ["June solstice",     new Date(2026, 5, 10),  "2026-06-21T08:25:00Z"],
      ["September equinox", new Date(2026, 8, 10),  "2026-09-23T00:06:00Z"],
      ["December solstice", new Date(2026, 11, 10), "2026-12-21T20:50:00Z"],
    ];
    for (const [name, from, want] of published) {
      const m = A.nextSeasonMark(from);
      eq(m.name, name, "wrong next mark from " + from.toDateString());
      const off = (new Date(m.at) - new Date(want)) / 60000;
      ok(Math.abs(off) < 30, name + " computed " + m.at + " vs published " + want + " (" + off.toFixed(1) + " min)");
      eq(m.at.slice(0, 10), want.slice(0, 10), name + " landed on the wrong date");
    }
  });
  test("the sun's declination matches the axial tilt", () => {
    near(A.solarDeclination(new Date(2026, 5, 21)), 23.44, 0.1, "June solstice declination");
    near(A.solarDeclination(new Date(2026, 11, 21)), -23.44, 0.1, "December solstice declination");
    ok(Math.abs(A.solarDeclination(new Date(2026, 2, 20))) < 0.2, "declination should be ~0 at the March equinox");
  });
  test("daylight behaves the way daylight has to", () => {
    near(A.dayLengthHours(0, new Date(2026, 2, 20)), 12.1, 0.15, "just over 12h at the equator on the equinox");
    eq(A.dayLengthHours(80, new Date(2026, 11, 21)), 0, "polar night above the circle");
    eq(A.dayLengthHours(80, new Date(2026, 5, 21)), 24, "midnight sun above the circle");
    ok(A.dayLengthHours(45, new Date(2026, 5, 21)) > A.dayLengthHours(45, new Date(2026, 11, 21)), "summer longer than winter");
    ok(Math.abs(A.dayLengthDeltaMinutes(45, new Date(2026, 5, 21), 1)) < 1, "the solstice barely changes daylight");
  });
  test("daylight change is reported in real units", () => {
    // the formatter once took minutes and printed seconds, so a 2m48s change read as "3s"
    const note = A.skyNote(A.skyFor(new Date(2026, 8, 22), 44.98));
    ok(!/lose \d+s of light/.test(note), "sub-minute unit for a multi-minute change: " + note);
    ok(/lose \dm /.test(note), "the change at the equinox should read in minutes: " + note);
  });
  test("the sky note is real prose about the real sky", () => {
    const note = A.skyNote(A.skyFor(new Date(2026, 8, 23), 44.98));
    ok(note.length > 80, "sky note too thin: " + note);
    ok(/equinox|solstice/.test(note), "a season mark should be named: " + note);
    // on the equinox itself the equinox is already past, so the NEXT mark is correct
    ok(/The (March|June|September|December) (equinox|solstice) is (today|\d+ days? off)\./.test(note),
       "the season mark sentence is malformed: " + note);
    ok(A.skyNote(A.skyFor(new Date(2026, 7, 12), 44.98)).includes("Perseids"), "the Perseids should be named at their peak");

    setWin(wd, true);
    const inWeek = A.rawColorFor(wd, ctx);
    eq(inWeek.shade.name, "Purple", "a win outranks " + wk.name);
    ok(!inWeek.holiday, "and the day is no longer presented as the holiday");
    // a single-day holiday keeps its day
    const one = A.HOLIDAYS.find(h => h.when), sd = new Date(2026, one.when[0] - 1, one.when[1]);
    setWin(sd, true);
    const single = A.rawColorFor(sd, ctx);
    ok(single.holiday && single.holiday.name === one.name && !single.stadium, one.name + " should keep its day");
    localStorage.removeItem("toga.nfl");
    if (saved) localStorage.setItem("toga.region", saved); else localStorage.removeItem("toga.region");
  });
  group("outfit · one colour, worn your way");
  const hexOK = h => /^#[0-9a-f]{6}$/i.test(h || "");
  const fitOn = i => { const d = dayAt(i), r = A.colorForDate(d); return [A.outfitFor(r), r, d]; };
  test("the day's colour goes on the top, and nothing is suggested below it", () => {
    for (let i = 0; i < SPAN; i++) {
      const [f, r, d] = fitOn(i);
      eq(f.hero.label, r.shade.name, "the top is not the day's colour on " + d.toDateString());
      ok(hexOK(f.hero.hex) && f.hero.alias, "bad piece on " + d.toDateString());
      ok(!f.bottom, "a piece below is still being suggested on " + d.toDateString());
    }
  });
  test("nothing anywhere suggests trousers", () => {
    // The trouser palette is gone: no second garment, no shade list for it, no copy about
    // what to wear below. One colour drops into whatever the person already wears.
    ok(!A.BOTTOMS, "the trouser palette is still published");
    A.renderHero(new Date(2026, 8, 21));
    eq(doc.querySelectorAll("#heroPair .garment").length, 1, "more than one garment in the hero");
    const words = doc.body.innerText;
    for (const word of ["down below", "trouser", "pants", "chinos", "slacks"])
      ok(!new RegExp(word, "i").test(words), "the page still talks about the bottom half: '" + word + "'");
  });
  test("no shade list suggests denim (office dress codes ban it)", () => {
    const banned = /denim|jean|indigo|dark wash/i;
    for (const c of A.PALETTE) ok(!banned.test(c.qualifies), c.label + " suggests denim: " + c.qualifies);
    ok(!banned.test(doc.body.innerText), "the word denim appears on screen");
  });
  test("Monochrome Week is still the same colour top and toe", () => {
    let seen = 0;
    for (let i = 0; i < SPAN; i++) {
      const [f, r] = fitOn(i);
      if (!r.theme || r.theme.name !== "Monochrome Week") continue;
      seen++;
      ok(f.mono && f.note.includes(r.shade.name), "Monochrome Week not honoured on " + r.shade.name);
    }
    ok(seen > 0, "never found a Monochrome Week to test");
  });
  test("the line leaves the rest of the outfit to the reader", () => {
    for (let i = 0; i < SPAN; i += 5) {
      const [f] = fitOn(i), plain = f.note.replace(/<\/?b>/g, "");
      if (f.mono) { ok(f.note.includes(f.hero.label), "the monochrome line does not name the colour"); continue; }
      ok(/accent/.test(plain), "no accent line on " + plain);
      ok(/yours/.test(plain), "nothing says the rest is theirs: " + plain);
      ok(!/trouser|bottom|below/i.test(plain), "the note still mentions a bottom half: " + plain);
    }
  });
  test("the card never changes during the day", () => {
    for (let i = 0; i < SPAN; i += 5) {
      const [f, , d] = fitOn(i), late = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 22, 10);
      eq(A.outfitFor(A.colorForDate(late)).note, f.note, "the card drifted on " + d.toDateString());
    }
  });
  test("nothing about wardrobes is left on the page", () => {
    // The drawer is gone: no sheet, no link, no chips, and no second version of the card's
    // line that depended on it. outfitFor reads no storage at all now.
    ok(!A.getOwn && !A.OWN_KEY, "the drawer is still published to the test surface");
    eq(doc.getElementById("drawer"), null, "the drawer sheet is still in the page");
    ok(!/tops you own|what you own|which tops/i.test(doc.body.innerText), "the page still asks about a wardrobe");
    ok(!doc.querySelector("[data-kind], #drawerBtn, #drawerTitle"), "a piece of the drawer is still on the page");
    for (const c of A.PALETTE) {
      const note = A.outfitFor({ shade: { name: c.label, hex: c.hex }, family: c, theme: null }).note;
      ok(/accent/i.test(note) && /yours/i.test(note), c.label + " lost its accent line: " + note);
    }
  });

  group("outfit · the patterned top");
  const hueOf = hex => { const [r, g, b] = A.hexRGB(hex).map(v => v / 255), mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
    if (d < 0.04) return null;
    return ((mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60 + 360) % 360; };
  test("every colour's four shades are distinct and stay in its own family", () => {
    for (const c of A.PALETTE) {
      const s = A.shadesOf(c.hex), h0 = hueOf(c.hex);
      eq(s[0].toLowerCase(), c.hex.toLowerCase(), "the day's own colour should lead");
      eq(new Set(s.map(x => x.toLowerCase())).size, 4, c.label + " shades are not distinct: " + s.join(" "));
      for (const x of s) {
        ok(hexOK(x), c.label + " produced " + x);
        const h = hueOf(x);
        if (h0 === null) { const v = A.hexRGB(x); ok(Math.max(...v) - Math.min(...v) < 40, "a shade of " + c.label + " picked up a colour: " + x); continue; }
        if (h === null) continue;
        const dh = Math.abs(h - h0);
        ok(Math.min(dh, 360 - dh) <= 14, "a shade of " + c.label + " drifted " + Math.round(Math.min(dh, 360 - dh)) + " degrees: " + x);
      }
    }
  });
  test("the top's pattern is drawn only from those shades, on the day's colour", () => {
    for (const c of A.PALETTE) for (let i = 0; i < 40; i++) {
      const p = A.topPattern(dayAt(i), c.hex, false);
      const used = [...p.svg.matchAll(/(?:fill|stroke)="(#[0-9a-f]{6})"/gi)].map(m => m[1].toLowerCase());
      eq(used[0], c.hex.toLowerCase(), p.kind + " is not grounded in " + c.label);
      ok(new Set(used).size >= 2, p.kind + " on " + c.label + " is one flat colour");
      for (const u of used) ok(p.shades.map(x => x.toLowerCase()).includes(u), p.kind + " uses a colour outside " + c.label + ": " + u);
    }
  });
  test("the weave changes from day to day, holds through the day, and a flannel day is plaid", () => {
    const hex = A.byLabel("Blue").hex, kinds = new Set();
    for (let i = 0; i < 120; i++) {
      const d = dayAt(i), late = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 22, 10), k = A.topPattern(d, hex, false).kind;
      eq(A.topPattern(late, hex, false).kind, k, "the weave drifted on " + d.toDateString());
      kinds.add(k);
    }
    eq(kinds.size, A.TOP_KINDS.length, "only saw " + [...kinds].join(", "));
    eq(A.topPattern(dayAt(3), hex, true).kind, "plaid");
  });

  // ---------------------------------------------------------------- region
  group("regions · the shared-area promise");
  test("the region table loads and every entry is well-formed", () => {
    ok(A.REGIONS && Object.keys(A.REGIONS).length > 800, "regions table missing or thin");
    for (const [p, v] of Object.entries(A.REGIONS)) {
      ok(/^\d{3}$/.test(p), "bad prefix " + p);
      ok(Array.isArray(v) && typeof v[0] === "number" && typeof v[1] === "number" && typeof v[2] === "string", "bad entry " + p);
      ok(Math.abs(v[0]) <= 90 && Math.abs(v[1]) <= 180, "out-of-range coords for " + p);
    }
  });
  test("a zip maps to its 3-digit region, and unknown ones map to nothing", () => {
    const known = Object.keys(A.REGIONS);
    for (const p of known.slice(0, 60)) { eq(A.regionOf(p + "01"), p); eq(A.regionOf(p), p); }
    const unknown = ["000", "010", "020", "099"].filter(p => !A.REGIONS[p]);
    ok(unknown.length > 0, "need at least one unassigned prefix to test");
    for (const p of unknown) eq(A.regionOf(p + "99"), null, p + " should not resolve");
    eq(A.regionOf("abc"), null); eq(A.regionOf(""), null); eq(A.regionOf("5"), null);
  });

  } finally {
    // put things back
    for (const [k, v] of Object.entries(saved)) { if (v === null) app.localStorage.removeItem(k); else app.localStorage.setItem(k, v); }
    A.renderAll();
  }

  // ---------------------------------------------------------------- report
  report();
  checkVersion();
}

function report() {
  const failed = res.filter(r => !r.ok);
  const ms = Math.round(performance.now() - t0);
  const banner = document.getElementById("banner");
  banner.className = "banner " + (failed.length ? "fail" : "pass");
  banner.textContent = failed.length
    ? failed.length + " of " + res.length + " FAILED"
    : "all " + res.length + " passed · " + ms + "ms";
  document.getElementById("sub").textContent = "index.html in a same-origin iframe · " + res.length + " assertions · " + ms + "ms";
  document.title = (failed.length ? "✗ " + failed.length + "/" + res.length : "✓ " + res.length) + " · Toga tests";
  window.__toga = { passed: res.length - failed.length, failed: failed.length, total: res.length, ms,
                    failures: failed.map(f => f.suite + " › " + f.name + ": " + f.err) };
}

// The one check that needs the network: the number on screen must be the cache name, or it
// stops meaning "the build my browser cached" — which is the whole reason it is visible.
async function checkVersion() {
  const app = frame.contentWindow;
  let good = false, note = "";
  try {
    const txt = await (await fetch("sw.js", { cache: "no-store" })).text();
    const m = (txt.match(/VERSION\s*=\s*"([^"]+)"/) || [])[1];
    const shown = app.TOGA && app.TOGA.VERSION;
    good = !!m && m === shown;
    note = good ? "" : "sw.js says " + m + ", the page shows " + shown;
  } catch (e) { note = "could not read sw.js: " + e; }
  res.push({ suite: "brand", name: "the shown build number is the service worker's cache name", ok: good, err: note });
  report();
  window.__togaDone = true;
}
</script>
