name: Vikings score

# Writes nfl.json for the page to read. The fetch happens HERE, on a runner, because a
# browser cannot call a public sports API (it answers curl, which sends no Origin header,
# but refuses a page, which always sends one). Runs every three hours so a Sunday result is
# sitting in the file well before Monday morning.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: vikings-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look up the latest settled Vikings result
        run: python3 .github/scripts/vikings_score.py

      - name: Commit, if it changed
        run: |
          if [ -z "$(git status --porcelain nfl.json)" ]; then
            echo "no change - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl.json
          git commit -m "Vikings score: refresh nfl.json"
          git push
